name: Build Last Shelter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: godot --headless --path . --export-release "Android" LastShelter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Last-Shelter-Android
          path: LastShelter.apk
